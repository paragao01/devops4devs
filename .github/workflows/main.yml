name: CI-CD
on: 
    push: 
        branches: ["main"]
    workflow_dispatch:

jobs: 
    CI:
        runs-on: ubuntu-latest
        steps: 
          - name: Obtendo código
            uses: actions/checkout@v4

          - name: Login to Docker Hub
            uses: docker/login-action@v3
            with:
              username: ${{ secrets.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_TOKEN }}
                
          - name: Construção e envio da imagem docker
            uses: docker/build-push-action@v5
            with:
              context: src
              file: src/Review-Filmes.Web/Dockerfile
              push: true
              tags: |
                oagara/devops4dev-review:v${{ github.run_number }}
                oagara/devops4dev-review:latest
  
    CD:
        runs-on: ubuntu-latest
        needs: [CI]
        steps:
          - name: Obtendo código
            uses: actions/checkout@v4

          - name: Atualizar a Imagem no Manifesto k8s
            run: |
              sed -i 's|image: oagara/devops4dev-review.*|image: oagara/devops4dev-review:v${{ github.run_number }}|' k8s/deployment.yaml

          - name: Commit e Push das Alterações
            run: |
              git config user.name "GitHub Actions"
              git config user.email "actions@github.com"
              git add k8s/deployment.yaml
              git commit -m "Atualizando imagem para oagara/devops4dev-review:v${{ github.run_number }}"
              git push

